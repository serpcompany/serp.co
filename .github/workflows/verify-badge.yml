name: Verify badge on issue
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  verify:
    if: >-
      (github.event_name == 'issues') ||
      (!github.event.issue.pull_request &&
      contains(github.event.comment.body, '/check-badge'))
    runs-on: ubuntu-latest
    steps:
      - name: Extract website URL from issue body
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.issue || context.payload).body || '';
            const match = body.match(/URL:\s*(https?:\/\/\S+)/i);
            if (!match) {
              core.setFailed('Could not find a URL in issue body');
              return;
            }
            core.setOutput('url', match[1].replace(/[\s,]+$/, ''));

            // Get issue author
            const issue = context.payload.issue || context.payload;
            core.setOutput('author', issue.user.login);

      - name: Check for badge / backlink
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.extract.outputs.url }}';
            const domain = context.repo.repo;

            let html;
            try {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 10000);
              const resp = await fetch(url, {
                headers: { 'User-Agent': 'DirectoryVerifier/1.0' },
                signal: controller.signal,
                redirect: 'follow'
              });
              clearTimeout(timeout);
              html = await resp.text();
            } catch (err) {
              core.setOutput('found', 'false');
              core.setOutput('message', `Could not reach ${url} — ${err.message}`);
              return;
            }

            // Parse all <a> tags and check for dofollow links to exact domain
            const esc = domain.replace(/\./g, '\\.');
            const domainRegex = new RegExp(`^https?://(www\\.)?${esc}(/|$)`, 'i');

            // Find all anchor tags
            const anchorRegex = /<a\s[^>]*>/gi;
            let foundDofollow = false;
            let foundNofollow = false;
            let foundBadgeImg = false;
            let foundToken = false;
            let match;

            while ((match = anchorRegex.exec(html)) !== null) {
              const tag = match[0];
              // Extract href
              const hrefMatch = tag.match(/href=["']([^"']+)["']/i);
              if (!hrefMatch) continue;
              const href = hrefMatch[1];

              // Check if href points to our exact domain
              if (!domainRegex.test(href)) continue;

              // Check rel attribute for nofollow
              const relMatch = tag.match(/rel=["']([^"']+)["']/i);
              const relValues = relMatch ? relMatch[1].toLowerCase().split(/\s+/) : [];
              const isNofollow = relValues.includes('nofollow');

              if (isNofollow) {
                foundNofollow = true;
                continue;
              }

              foundDofollow = true;

              // Check if this link wraps a badge image (look ahead in HTML for </a>)
              const afterTag = html.substring(match.index + tag.length, match.index + tag.length + 500);
              const closingA = afterTag.indexOf('</a>');
              if (closingA !== -1) {
                const inner = afterTag.substring(0, closingA);
                if (/<img\s/i.test(inner) && new RegExp(`${esc}`, 'i').test(inner)) {
                  foundBadgeImg = true;
                }
                if (/data-verify-token=/i.test(inner)) {
                  foundToken = true;
                }
              }
            }

            if (foundDofollow) {
              const details = ['dofollow backlink'];
              if (foundBadgeImg) details.push('badge image');
              if (foundToken) details.push('verify token');
              core.setOutput('found', 'true');
              core.setOutput('message', `Badge verified on ${url} — found: ${details.join(', ')}.`);
            } else if (foundNofollow) {
              core.setOutput('found', 'false');
              core.setOutput('message', `Found a link to ${domain} on ${url}, but it is marked as **nofollow**. The badge link must be a **dofollow** link (remove \`rel="nofollow"\` from the \`<a>\` tag).`);
            } else {
              core.setOutput('found', 'false');
              core.setOutput('message', `No link to ${domain} found on ${url}. We look for a dofollow \`<a href>\` link pointing to ${domain}.`);
            }

      - name: Post result comment
        uses: actions/github-script@v7
        with:
          script: |
            const found = '${{ steps.check.outputs.found }}' === 'true';
            const message = '${{ steps.check.outputs.message }}';
            const author = '${{ steps.extract.outputs.author }}';
            const domain = context.repo.repo;
            const issueNumber = (context.payload.issue || context.payload).number;

            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `:white_check_mark: **Badge Check**\n\n${message}`
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['verified']
              });
            } else {
              // Parse submitter name from issue for listing URL
              const issueBody = (context.payload.issue || context.payload).body || '';
              const nameMatch = issueBody.match(/^Name:\s*(.+)$/m);
              const productName = nameMatch?.[1]?.trim() || '';
              let listingSlug;
              const urlMatch = issueBody.match(/URL:\s*(https?:\/\/\S+)/i);
              try { listingSlug = new URL(urlMatch[1]).hostname.replace(/^www\./, ''); } catch { listingSlug = productName.toLowerCase().replace(/[^\w.-]+/g, '-'); }
              const listingUrl = `https://${domain}/products/${listingSlug}/reviews/`;

              const badgeSnippet = `<a href="${listingUrl}" target="_blank" title="Featured on ${domain}">\n  <img src="https://${domain}/badge/featured-on-${domain}-light.svg" alt="Featured on ${domain}" width="200" height="50" />\n</a>`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `:x: **Badge Check**\n\n${message}\n\n---\n\n@${author} — To get your listing approved, please add a **"Featured on ${domain}"** badge to your website.\n\n**Steps:**\n1. Copy the badge code below\n2. Paste it into your website's HTML (footer, sidebar, or homepage)\n3. Make sure it's on a publicly accessible page (not behind auth)\n4. Come back here and comment \`/check-badge\` to re-verify\n\n**Badge code:**\n\`\`\`html\n${badgeSnippet}\n\`\`\`\n\n**Badge preview:**\n\n![Featured on ${domain}](https://${domain}/badge/featured-on-${domain}-light.svg)`
              });
            }
