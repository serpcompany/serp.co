name: Approve listing from issue
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  approve:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - name: Parse and create PR
        id: create_pr
        uses: actions/github-script@v7
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const body = context.payload.issue.body || '';

            // Parse fields
            const name = body.match(/^Name:\s*(.+)$/m)?.[1]?.trim();
            const url = body.match(/URL:\s*(https?:\/\/\S+)/i)?.[1]?.replace(/[\s,]+$/, '');
            const category = body.match(/^Category:\s*(.+)$/m)?.[1]?.trim();
            const logoUrl = body.match(/^Logo URL:\s*(https?:\/\/\S+)$/m)?.[1]?.trim();

            const descMatch = body.match(/## Description\s*\n+([\s\S]*?)(?=\n## |\n*$)/);
            const description = descMatch?.[1]?.trim() || '';

            const notesMatch = body.match(/## Additional notes\s*\n+([\s\S]*?)(?=\n## |\n*$)/);
            const notes = notesMatch?.[1]?.trim() || '';

            const rlSection = body.match(/## Resource links\s*\n+([\s\S]*?)(?=\n## |\n*$)/);
            const resourceLinks = [];
            if (rlSection) {
              for (const m of rlSection[1].matchAll(/^- (.+?):\s*(https?:\/\/\S+)$/gm)) {
                resourceLinks.push({ label: m[1].trim(), url: m[2].trim() });
              }
            }

            if (!name || !url) {
              core.setFailed(`Could not parse required fields. Name: "${name}", URL: "${url}"`);
              return;
            }

            // Derive slug from hostname
            let slug;
            try {
              slug = new URL(url).hostname.replace(/^www\./, '');
            } catch {
              slug = name.toLowerCase().replace(/[^\w.-]+/g, '-').replace(/^-|-$/g, '');
            }

            // Build entry
            let contentBody = `## Overview\n\n${description}`;
            if (notes) contentBody += `\n\n${notes}`;

            const entry = {
              featured: false,
              media: {},
              product: {
                categories: [category || 'other'],
                productPage: url,
                slug,
                tagline: description.split('\n')[0].substring(0, 150),
                title: name
              },
              content: { body: contentBody },
              relatedLinks: resourceLinks.length > 0 ? resourceLinks : [{ label: name, url }]
            };
            if (logoUrl) entry.media.logo = `/media/products/${slug}/logo.png`;

            const owner = 'serpcompany';
            const repo = 'json-directory-template';
            const siteRepo = context.repo.repo;
            const issueNumber = context.issue.number;
            const branch = `listing/${siteRepo}/${slug}`;
            const productsPath = `sites/${siteRepo}/products.json`;

            // Get main branch SHA
            const { data: mainRef } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });

            // Create branch
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: mainRef.object.sha });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            // Get file via git blob API (handles large files)
            const { data: tree } = await github.rest.git.getTree({ owner, repo, tree_sha: `main:sites/${siteRepo}`, recursive: false });
            const productsBlob = tree.tree.find(t => t.path === 'products.json');
            if (!productsBlob) { core.setFailed('products.json not found'); return; }

            const { data: blob } = await github.rest.git.getBlob({ owner, repo, file_sha: productsBlob.sha });
            const currentContent = Buffer.from(blob.content, 'base64').toString('utf-8');
            const products = JSON.parse(currentContent);

            // Add entry
            products[slug] = entry;
            const updatedContent = JSON.stringify(products, null, 2) + '\n';

            // Get file SHA for update (from the branch, fallback to main)
            let fileSha;
            try {
              const { data: fileOnBranch } = await github.rest.repos.getContent({ owner, repo, path: productsPath, ref: branch });
              fileSha = fileOnBranch.sha;
            } catch {
              fileSha = productsBlob.sha;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: productsPath,
              message: `feat(listing): add ${name} to ${siteRepo}`,
              content: Buffer.from(updatedContent).toString('base64'),
              sha: fileSha,
              branch
            });

            // Create PR
            const { data: pr } = await github.rest.pulls.create({
              owner, repo,
              title: `feat(listing): add ${name} to ${siteRepo}`,
              head: branch,
              base: 'main',
              body: `## Summary\n- Add **${name}** (\`${slug}\`) to ${siteRepo} listings\n- Source: ${owner}/${siteRepo}#${issueNumber}\n\n🤖 Auto-generated from verified submission issue.`
            });

            core.setOutput('pr_url', pr.html_url);

      - name: Comment on issue with PR link
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = '${{ steps.create_pr.outputs.pr_url }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `:rocket: **Listing approved!**\n\nA pull request has been created to add this listing: ${prUrl}\n\nThe listing will go live once the PR is merged and deployed.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['approved']
            });
